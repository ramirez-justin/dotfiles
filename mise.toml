[tools]
python = "3.12"
bun = "latest"

[settings]
minimum_release_age_excludes = ["npm:@earendil-works/pi-coding-agent"]

[tasks.bootstrap]
description = "Full machine setup (after 1Password is authenticated)"
depends = ["brew-install", "tools-install", "install-omz", "chalk-install"]
run = "mise run link"

[tasks.trust-third-party-brew-taps]
description = "Opt-in: trust third-party Homebrew taps required by Brewfile"
run = """
set -e
brew trust dbt-labs/dbt-cli
brew trust exploreomni/tap
brew trust go-task/tap
brew trust hashicorp/tap
brew trust snowflakedb/snowflake-cli
"""

[tasks.brew-install]
description = "Install all packages from Brewfile"
run = """
set -e

# Homebrew's docker and docker-completion formulae both install the same
# bash completion file. The Brewfile manages docker, so ensure its completion
# can be linked before running brew bundle.
if brew list --formula docker-completion >/dev/null 2>&1; then
    brew unlink docker-completion >/dev/null 2>&1 || true
fi

brew bundle --file={{config_root}}/Brewfile
"""

[tasks.tools-install]
description = "Install mise-managed tools"
run = "mise install"

[tasks.chalk-install]
description = "Install or update the Chalk CLI"
depends = ["brew-install"]
run = """
set -euo pipefail
export CHALK_INSTALL="${CHALK_INSTALL:-$HOME/.chalk}"
export PATH="$CHALK_INSTALL/bin:$PATH"
version="${CHALK_VERSION:-latest}"
curl -fsSL https://api.chalk.ai/install.sh | sh -s -- "$version"
chalk version
"""

[tasks.check-agent-tiers]
description = "Verify Pi agent tiers, defaults, and local workflow skills"
run = """
set -e
cd {{config_root}}
python3 - <<'PY'
import json
import pathlib
import subprocess
import sys

root = pathlib.Path.cwd()
agents = root / "pi/.pi/agent/agents"
settings_path = root / "pi/.pi/agent/settings.json"

expected = {
    "AstraPlan.md": ("openai-codex/gpt-6-astra", "max"),
    "Explore.md": ("openai-codex/gpt-5.6-luna", "max"),
    "implementer.md": ("openai-codex/gpt-6-astra", "low"),
    "oracle.md": ("openai-codex/gpt-5.6-terra", "max"),
    "Plan.md": ("openai-codex/gpt-5.6-terra", "max"),
    "researcher.md": (
        "pi-claude-code-provider/sonnet",
        "high",
    ),
    "reviewer.md": ("openai-codex/gpt-5.6-terra", "max"),
    "simplifier.md": ("openai-codex/gpt-5.6-terra", "max"),
    "verifier.md": ("openai-codex/gpt-5.6-luna", "max"),
    "worker.md": ("openai-codex/gpt-5.6-sol", "medium"),
}


def frontmatter(path):
    text = path.read_text()
    parts = text.split("---", 2)
    if len(parts) != 3:
        raise ValueError(f"{path}: missing YAML frontmatter")
    values = {}
    for line in parts[1].splitlines():
        if ": " in line:
            key, value = line.split(": ", 1)
            values[key] = value
    return values


errors = []
for name, (model, thinking) in expected.items():
    path = agents / name
    if not path.is_file():
        errors.append(f"missing required agent: {path}")
        continue
    values = frontmatter(path)
    if values.get("model") != model:
        errors.append(
            f"{path}: expected model {model}, got "
            f"{values.get('model')}"
        )
    if values.get("thinking") != thinking:
        errors.append(
            f"{path}: expected thinking {thinking}, got "
            f"{values.get('thinking')}"
        )

simplifier = agents / "simplifier.md"
if simplifier.is_file():
    values = frontmatter(simplifier)
    for key, value in {"tools": "read, grep, find", "isolated": "true"}.items():
        if values.get(key) != value:
            errors.append(f"{simplifier}: expected {key}={value}")

subagents_path = root / "pi/.pi/agent/subagents.json"
subagents = json.loads(subagents_path.read_text())
if subagents.get("fallbackSubagent") != "none":
    errors.append(f"{subagents_path}: expected fallbackSubagent=none")

changed_paths = set()
for args in (
    ["diff", "--name-only", "-z"],
    ["diff", "--cached", "--name-only", "-z"],
    ["ls-files", "--others", "--exclude-standard", "-z"],
):
    result = subprocess.run(
        ["git", *args], check=True, capture_output=True, text=True,
    )
    changed_paths.update(result.stdout.split("\\0"))

pi_root = pathlib.Path("pi/.pi/agent")
markers = ("TODO", "TBD")
instructions = {"AGENTS.md", "AGENT.local.md", "CLAUDE.md", "CLAUDE.local.md"}
for name in sorted(changed_paths - {""}):
    relative = pathlib.Path(name)
    path = root / relative
    if path.suffix.lower() != ".md" or not path.is_file():
        continue
    pi_markdown = relative.is_relative_to(pi_root) and (
        relative.relative_to(pi_root).parts[0] in {"agents", "skills", "prompts"}
        or path.name in instructions
    )
    for number, line in enumerate(path.read_text().splitlines(), 1):
        if len(line) > 80:
            errors.append(f"{relative}:{number}: line exceeds 80 characters")
        if pi_markdown and any(marker in line for marker in markers):
            errors.append(f"{relative}:{number}: unfinished marker")

actual_files = {path.name for path in agents.glob("*.md")}
extra_files = sorted(actual_files - set(expected))
if extra_files:
    errors.append(f"unvalidated agent definitions: {extra_files}")

settings = json.loads(settings_path.read_text())
sources = [
    item if isinstance(item, str) else item.get("source")
    for item in settings.get("packages", [])
]
required_sources = {
    "git:https://github.com/obra/superpowers.git",
    "npm:pi-claude-code-provider",
}
for source in sorted(required_sources):
    if source not in sources:
        errors.append(f"{settings_path}: missing package {source}")

for source in sources:
    if source and source.startswith(
        "git:https://github.com/obra/superpowers.git@"
    ):
        errors.append(f"{settings_path}: Superpowers must be unpinned")
    if source and source.startswith("npm:pi-claude-code-provider@"):
        errors.append(f"{settings_path}: Claude provider must be unpinned")

# Require the explicit allowlist so broad globs, omitted filters, or a
# duplicate package entry cannot silently restore upstream orchestration.
retained_skills = {
    "brainstorming",
    "systematic-debugging",
    "test-driven-development",
    "verification-before-completion",
    "finishing-a-development-branch",
    "receiving-code-review",
    "requesting-code-review",
    "using-git-worktrees",
}
superpowers = [
    item for item in settings.get("packages", [])
    if (item if isinstance(item, str) else item.get("source"))
    == "git:https://github.com/obra/superpowers.git"
]
expected_filters = {f"skills/{name}/**" for name in retained_skills}
if len(superpowers) != 1 or not isinstance(superpowers[0], dict):
    errors.append("Superpowers must have exactly one filtered package entry")
else:
    filters = superpowers[0].get("skills")
    if not isinstance(filters, list) or set(filters) != expected_filters:
        errors.append(
            "Superpowers skills must use the retained engineering allowlist; "
            "writing-plans and executing-plans must remain local only"
        )

for name in ("writing-plans", "executing-plans", "ponytail-review"):
    path = root / "pi/.pi/agent/skills" / name / "SKILL.md"
    if not path.is_file():
        errors.append(f"missing local workflow skill: {path}")
        continue
    try:
        values = frontmatter(path)
    except ValueError as error:
        errors.append(str(error))
        continue
    if values.get("name") != name:
        errors.append(f"{path}: expected skill name {name}")
    if not values.get("description"):
        errors.append(f"{path}: missing skill description")

required_defaults = {
    "defaultProvider": "openai-codex",
    "defaultModel": "gpt-5.6-sol",
    "defaultThinkingLevel": "medium",
}
for key, value in required_defaults.items():
    if settings.get(key) != value:
        errors.append(
            f"{settings_path}: expected {key}={value}, got "
            f"{settings.get(key)}"
        )

if errors:
    print("\\n".join(errors), file=sys.stderr)
    raise SystemExit(1)

result = subprocess.run(
    ["mise", "exec", "--", "pi", "--offline", "--list-models"],
    check=True,
    capture_output=True,
    text=True,
)
catalog = {
    (parts[0], parts[1])
    for line in result.stdout.splitlines()
    if len(parts := line.split()) >= 2
}
for model, _thinking in expected.values():
    provider, model_id = model.split("/", 1)
    if (provider, model_id) not in catalog:
        errors.append(f"Pi model catalog does not contain {model}")

if errors:
    print("\\n".join(errors), file=sys.stderr)
    raise SystemExit(1)

print("Pi agent models, defaults, and local workflow skills verified")
PY
"""

[tasks.check-memory]
description = "Run Pi memory-governor tests"
run = "mise exec -- bun test ./pi/.pi/agent/extensions/memory-governor"

[tasks.doctor]
description = "Verify dotfiles, shell tools, Pi, and local machine health"
run = """
set -e
cd {{config_root}}

check() {
    printf "%-34s" "$1"
    shift
    if "$@" >/tmp/dotfiles-doctor.out 2>&1; then
        echo " ok"
    else
        echo " failed"
        sed 's/^/  /' /tmp/dotfiles-doctor.out
        exit 1
    fi
}

check "brew bundle" sh -c '
brew_prefix=$(brew --prefix)
PATH="$brew_prefix/bin:$brew_prefix/sbin:$HOME/.cargo/bin:$PATH"
export PATH
export HOMEBREW_NO_AUTO_UPDATE=1
brew bundle check --no-upgrade --file="$1"
' sh {{config_root}}/Brewfile
check "stow available" command -v stow
check "mise available" command -v mise
check "mise tools installed" mise current
check "chalk available" command -v chalk
check "node available via mise" mise exec -- node -v
check "no standalone npm latest tool" sh -c "if grep -R -F '\"npm:npm\" = \"latest\"' {{config_root}}/mise/.config/mise/config.toml; then exit 1; fi"
check "node selectors avoid patch pins" sh -c "if grep -R -E 'node(@|/)[0-9]+[.][0-9]+[.][0-9]+' {{config_root}}/mise/.config/mise/config.toml {{config_root}}/pi/.pi/agent/settings.json {{config_root}}/claude/.claude/settings.json; then exit 1; fi"
check "Pi agent model tiers" mise run check-agent-tiers
check "pi available" command -v pi
check "Pi memory governor" mise run check-memory
check "pi starts offline" mise exec -- pi --offline --list-models
check "git submodules initialized" git submodule status --recursive
check "zsh config linked" sh -c '[ -L "$HOME/.zshrc" ]'
check "mise config linked" sh -c '[ -L "$HOME/.config/mise/config.toml" ] || [ -L "$HOME/.config/mise" ]'

check "no legacy Pi secret file" \
    sh -c '[ ! -e "$HOME/.pi/agent/env.local.zsh" ]'
check "no legacy Claude secret file" \
    sh -c '[ ! -e "$HOME/.claude/settings.local.json" ]'

echo "dotfiles doctor passed"
"""

[tasks.install-omz]
description = "Install oh-my-zsh and third-party custom plugins (alias-tips, zsh-completions)"
depends = ["brew-install"]
run = """
set -e
ZSH_DIR="${ZSH:-$HOME/.oh-my-zsh}"
if [ ! -d "$ZSH_DIR" ]; then
    echo "Installing oh-my-zsh into $ZSH_DIR..."
    RUNZSH=no CHSH=no KEEP_ZSHRC=yes sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
else
    echo "oh-my-zsh already present at $ZSH_DIR"
fi
ZSH_CUSTOM_DIR="${ZSH_CUSTOM:-$ZSH_DIR/custom}"
for repo in djui/alias-tips zsh-users/zsh-completions; do
    name="${repo##*/}"
    dest="$ZSH_CUSTOM_DIR/plugins/$name"
    if [ ! -d "$dest" ]; then
        echo "Cloning $repo -> $dest"
        git clone --depth=1 "https://github.com/$repo" "$dest"
    else
        echo "Plugin $name already present"
    fi
done
echo "oh-my-zsh ready"
"""

[tasks.link]
description = "Stow all topics into $HOME without installing packages"
run = """
set -e
if ! command -v stow >/dev/null 2>&1; then
    echo "GNU Stow is required; run 'mise run brew-install' during bootstrap." >&2
    exit 1
fi
stow --dir={{config_root}} --target=$HOME --restow zsh nvim tmux ghostty gh-dash gh git mise claude pi eza marimo snowflake
"""

[tasks.unlink]
description = "Remove all stow symlinks"
run = "stow --dir={{config_root}} --target=$HOME --delete zsh nvim tmux ghostty gh-dash gh git mise claude pi eza marimo snowflake"

[tasks.update]
description = "Pull latest dotfiles, re-link, and update Pi packages"
run = "git -C {{config_root}} pull --rebase && mise run link && mise run pi-update"

[tasks.pi-update]
description = "Update Pi packages/extensions and repair safe npm audit findings"
run = """
set -euo pipefail

pi_npm_root="$HOME/.pi/agent/npm"

mise exec -- pi update --extensions

if [ ! -f "$pi_npm_root/package.json" ]; then
    echo "Pi npm extension root not found at $pi_npm_root; skipping npm audit repair."
    exit 0
fi

if mise exec -- npm audit --prefix "$pi_npm_root" --omit=peer --audit-level=high; then
    echo "Pi extension npm audit passed."
    exit 0
fi

echo "Attempting safe npm audit repair for Pi extensions..."
mise exec -- npm audit fix --prefix "$pi_npm_root" --omit=peer --legacy-peer-deps

mise exec -- npm audit --prefix "$pi_npm_root" --omit=peer --audit-level=high
"""

[tasks.snowflake-ai-kit-install]
description = "Install or update Snowflake AI Kit and verify the default Snowflake connection"
run = """
set -euo pipefail

export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

repo="https://github.com/Snowflake-Labs/snowflake-ai-kit.git"
dest="${SNOWFLAKE_AI_KIT_ROOT:-$HOME/.local/share/snowflake-ai-kit}"

need() {
    if ! command -v "$1" >/dev/null 2>&1; then
        echo "Missing required command: $1" >&2
        echo "Install it, then rerun: mise run snowflake-ai-kit-install" >&2
        exit 1
    fi
}

need git
need bash
mkdir -p "$(dirname "$dest")"

if [ ! -d "$dest/.git" ]; then
    if [ -e "$dest" ]; then
        echo "Refusing to overwrite non-git path: $dest" >&2
        echo "Move it aside or set SNOWFLAKE_AI_KIT_ROOT to a git checkout." >&2
        exit 1
    fi
    echo "Cloning Snowflake AI Kit into $dest..."
    git clone "$repo" "$dest"
else
    echo "Updating Snowflake AI Kit in $dest..."
    git -C "$dest" pull --ff-only
fi

echo "Running Snowflake AI Kit installer..."
bash "$dest/install.sh"
hash -r

echo "Verifying cortex CLI..."
command -v cortex
cortex --version

echo "Verifying Snowflake CLI default connection..."
if ! command -v snow >/dev/null 2>&1; then
    echo "Snowflake CLI 'snow' is not on PATH after install." >&2
    echo "Open a new shell or add Homebrew to PATH, then rerun this task." >&2
    exit 1
fi
snow connection test -c default

echo "Snowflake AI Kit is ready."
"""

[tasks.brew-dump]
description = "Regenerate Brewfile (review and curate after running)"
run = "brew bundle dump --force --file={{config_root}}/Brewfile"

[tasks.submodule-update]
description = "Pull latest commits for all submodules (nvim, eza-themes)"
run = "git -C {{config_root}} submodule update --remote --merge"

[tasks.nvim-update]
description = "Update nvim to latest and commit the pointer"
run = """
  git -C {{config_root}} submodule update --remote --merge nvim/.config/nvim
  git -C {{config_root}} add nvim/.config/nvim
  git -C {{config_root}} commit -m "chore: update nvim to latest"
"""

[tasks.migrate-agent-secrets]
description = "Delete validated legacy agent secret files"
run = """
set -eu

secrets_env="$HOME/.pi/agent/agent-secrets.env"
claude_file="$HOME/.claude/settings.local.json"
pi_file="$HOME/.pi/agent/env.local.zsh"

if [ ! -r "$secrets_env" ]; then
    echo "Missing runtime secret references: $secrets_env" >&2
    exit 1
fi
if ! command -v op >/dev/null 2>&1; then
    echo "1Password CLI (op) is required for migration." >&2
    exit 1
fi

if ! python3 - "$claude_file" "$pi_file" <<'PY'
import json
import pathlib
import re
import sys

claude_file = pathlib.Path(sys.argv[1])
pi_file = pathlib.Path(sys.argv[2])
expected_claude = {
    "JIRA_API_TOKEN",
    "FIVETRAN_API_KEY",
    "FIVETRAN_API_SECRET",
}
expected_pi = expected_claude | {"LINEAR_API_KEY", "NOTION_API_KEY"}

if claude_file.exists():
    try:
        document = json.loads(claude_file.read_text())
    except (OSError, json.JSONDecodeError):
        raise SystemExit(1)
    if set(document) != {"env"} or set(document["env"]) != expected_claude:
        raise SystemExit(1)

if pi_file.exists():
    try:
        lines = pi_file.read_text().splitlines()
    except OSError:
        raise SystemExit(1)
    keys = set()
    for line in lines:
        match = re.fullmatch(r"export ([A-Z_][A-Z0-9_]*)='[^']*'", line)
        if not match:
            raise SystemExit(1)
        keys.add(match.group(1))
    if keys != expected_pi or len(lines) != len(expected_pi):
        raise SystemExit(1)
PY
then
    echo "Refusing to delete unrecognized legacy agent secret files." >&2
    exit 1
fi

op run --env-file="$secrets_env" -- true
rm -f -- "$claude_file" "$pi_file"
echo "Legacy agent secret files removed."
"""
