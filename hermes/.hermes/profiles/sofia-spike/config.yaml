model:
  default: gpt-5.5
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
providers: {}
fallback_providers: []
credential_pool_strategies: {}
toolsets:
- hermes-cli
agent:
  max_turns: 150
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  tool_use_enforcement: auto
  task_completion_guidance: true
  environment_probe: true
  reasoning_effort: medium
  system_prompt: '# SOFIA boot context requirement


    This profile uses SOFIA Cloud as the primary durable memory surface. At the

    start of every fresh session, load the `sofia-cloud-memory` skill when the

    skills tool is available, then verify that SOFIA boot context is already

    present in the system prompt. If it is not present, immediately call the

    SOFIA Cloud MCP `get_boot_context` tool before answering substantive

    questions or starting work. If SOFIA boot context cannot be loaded, stop and

    surface the failure instead of silently falling back to Hermes local memory.'
  disabled_toolsets: []
  verbose: false
terminal:
  backend: local
  cwd: .
  timeout: 180
  persistent_shell: true
  env_passthrough:
  - SOFIA_CLOUD_URL
  - SOFIA_MCP_ACCESS_KEY
  shell_init_files: []
web:
  backend: ddgs
browser:
  engine: auto
  cloud_provider: local
  allow_private_urls: false
checkpoints:
  enabled: true
  max_snapshots: 20
  retention_days: 7
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  personality: ''
  show_reasoning: false
  streaming: true
  timestamps: false
  final_response_markdown: strip
  persistent_output: true
  inline_diffs: true
  file_mutation_verifier: true
  turn_completion_explainer: true
  show_cost: false
  skin: rose-pine
  language: en
  tui_status_indicator: kaomoji
  user_message_preview:
    first_lines: 2
    last_lines: 2
  runtime_footer:
    enabled: true
    fields:
    - model
    - context_pct
    - cwd
  tool_progress: all
  long_running_notifications: true
  background_process_notifications: all
dashboard:
  theme: default
privacy:
  redact_pii: false
memory:
  memory_enabled: false
  user_profile_enabled: false
  memory_char_limit: 0
  user_char_limit: 0
  provider: ''
delegation:
  inherit_mcp_toolsets: true
  max_iterations: 50
  child_timeout_seconds: 600
  reasoning_effort: medium
  max_concurrent_children: 3
  max_spawn_depth: 1
  orchestrator_enabled: true
  subagent_auto_approve: false
skills:
  external_dirs:
  - ${HOME}/.hermes/skills
  template_vars: true
  inline_shell: false
  guard_agent_created: false
  creation_nudge_interval: 15
curator:
  enabled: false
approvals:
  mode: manual
  timeout: 60
  cron_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: true
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_fail_open: true
  allow_lazy_installs: true
cron:
  wrap_response: true
code_execution:
  mode: project
  timeout: 300
  max_tool_calls: 50
tools:
  tool_search:
    enabled: auto
    threshold_pct: 10
    search_default_limit: 5
    max_search_limit: 20
lsp:
  enabled: true
  wait_mode: document
  wait_timeout: 5.0
  install_strategy: auto
  servers: {}
mcp_servers:
  sofia-cloud:
    url: ${SOFIA_CLOUD_URL}
    headers:
      x-sofia-key: ${SOFIA_MCP_ACCESS_KEY}
    auth: false
    lifecycle: lazy
    enabled: true
    tools:
      include:
      - capture_event
      - search_memory
      - list_recent
      - review_candidates
      - run_lifecycle_maintenance
      - record_memory_feedback
      - archive_memory
      - get_boot_context
      - get_artifact
  context7:
    command: npx
    args:
    - -y
    - '@upstash/context7-mcp'
    lifecycle: lazy
    enabled: true
platform_toolsets:
  cli:
  - browser
  - clarify
  - code_execution
  - computer_use
  - cronjob
  - delegation
  - file
  - image_gen
  - messaging
  - session_search
  - skills
  - terminal
  - todo
  - tts
  - vision
  - web
  telegram:
  - clarify
  - cronjob
  - file
  - messaging
  - session_search
  - skills
  - terminal
  - todo
  - tts
  - vision
  - web
_config_version: 25
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
